name: calendar-app CI
on:
  push:
    paths: ["calendar-app/**", ".github/workflows/calendar-app.yml"]
  pull_request:
    paths: ["calendar-app/**", ".github/workflows/calendar-app.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calendar-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 直接在 PostgreSQL 上驗證 RLS（模擬 Supabase 的 auth schema 與角色）
      - run: npm run test:rls
      - run: npm run build
